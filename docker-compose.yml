version: '3.9'

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scoutiq}
      POSTGRES_USER: ${POSTGRES_USER:-scoutiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scoutiq_dev_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-scoutiq}']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scoutiq}:${POSTGRES_PASSWORD:-scoutiq_dev_pass}@postgres:5432/${POSTGRES_DB:-scoutiq}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-scoutiq}:${POSTGRES_PASSWORD:-scoutiq_dev_pass}@postgres:5432/${POSTGRES_DB:-scoutiq}
      REDIS_URL: redis://redis:6379/0
      SNAPSHOT_LOCAL_DIR: /data/snapshots
    volumes:
      - snapshots:/data/snapshots
      - ./fixtures:/app/fixtures:ro
    ports:
      - '8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port 8000"

  worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-scoutiq}:${POSTGRES_PASSWORD:-scoutiq_dev_pass}@postgres:5432/${POSTGRES_DB:-scoutiq}
      DATABASE_URL_SYNC: postgresql://${POSTGRES_USER:-scoutiq}:${POSTGRES_PASSWORD:-scoutiq_dev_pass}@postgres:5432/${POSTGRES_DB:-scoutiq}
      REDIS_URL: redis://redis:6379/0
      SNAPSHOT_LOCAL_DIR: /data/snapshots
    volumes:
      - snapshots:/data/snapshots
      - ./fixtures:/app/fixtures:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: python -m worker.main

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    ports:
      - '3000:3000'
    depends_on:
      - api
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000

volumes:
  postgres_data:
  snapshots:
