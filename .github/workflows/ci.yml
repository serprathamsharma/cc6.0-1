name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: scoutiq_test
          POSTGRES_USER: scoutiq
          POSTGRES_PASSWORD: testpass
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: api/requirements.txt

      - name: Install dependencies
        run: cd api && pip install -r requirements.txt

      - name: Lint
        run: cd api && ruff check . || true

      - name: Run tests
        env:
          DEMO_MODE: 'true'
          REPLAY_MODE: 'true'
          DATABASE_URL: postgresql+asyncpg://scoutiq:testpass@localhost:5432/scoutiq_test
          REDIS_URL: redis://localhost:6379/0
          APP_SECRET_KEY: ci-test-secret-key-32-chars-long!
        run: cd api && pytest tests/ -x -q

      - name: Run evals
        env:
          DEMO_MODE: 'true'
          REPLAY_MODE: 'true'
        run: cd api && python evals/run_evals.py

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: cd frontend && npm ci --legacy-peer-deps || true
      - name: Build
        run: cd frontend && npm run build || true
